<style>
:root{
  --bg:#050A08; --panel:rgba(255,255,255,.035); --panel2:rgba(255,255,255,.065);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#E9F2EC; --dim:#8FA398; --dim2:#5E7167;
  --lime:#A3D65C; --danger:#FF6B6B; --warn:#FBBF24; --ok:#4ADE80; --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.01em;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--lime)}
code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:6px;color:var(--lime)}

/* fondo */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#12261C 0%,transparent 55%),var(--bg)}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 15%,transparent 75%)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.32;animation:drift 24s ease-in-out infinite alternate}
.o1{width:440px;height:440px;background:#3E7A2E;top:-140px;left:-100px}
.o2{width:380px;height:380px;background:#1F5F6B;bottom:-140px;right:-80px;animation-delay:-8s}
.o3{width:280px;height:280px;background:#5B3A8C;top:42%;left:52%;opacity:.16;animation-delay:-14s}
@keyframes drift{to{transform:translate(70px,40px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.orb,.bwrap{animation:none!important}}

.wrap{max-width:1240px;margin:0 auto;padding:0 24px 90px}
.dim{color:var(--dim)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:600}
.help{font-size:11.5px;color:var(--dim2);margin-top:5px;line-height:1.45}

/* botones e inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;transition:background .2s,border-color .2s,filter .2s;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1)}
.btn.primary{background:var(--lime);color:#0B1409;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(255,107,107,.35);background:transparent}
.btn.sm{padding:6px 12px;font-size:12px}
.icon-btn{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line2);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--text);transition:background .2s}
.icon-btn:hover{background:var(--panel2)}
.inp{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--lime)}
textarea.inp{resize:vertical;min-height:84px}
select.inp option{background:#0A1310}
.inp.sm{padding:6px 10px;font-size:12.5px;width:auto;border-radius:999px}
input[type=color].inp{padding:4px;height:42px;cursor:pointer}
label.f{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:500}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:400px;padding:38px 30px 30px;border-radius:30px;background:rgba(10,19,16,.72);border:1px solid var(--line2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 30px 90px -30px #000;text-align:center;display:flex;flex-direction:column;gap:12px}
.login-orb{width:92px;height:92px;margin:0 auto 6px;border-radius:50%;padding:6px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 40%),rgba(163,214,92,.18);border:1px solid rgba(163,214,92,.4);box-shadow:0 0 50px -8px rgba(163,214,92,.6);animation:bob 5s ease-in-out infinite}
.login-orb img{width:100%;height:100%;border-radius:50%;display:block}
@keyframes bob{50%{transform:translateY(-6px)}}
.login-card h2{font-size:24px}
.login-card .btn.primary{padding:12px;font-size:14px;margin-top:4px}
.linkbtn{background:none;border:none;color:var(--dim);font-size:12.5px;cursor:pointer;text-decoration:underline}
.lerr{color:#FFB4B4;font-size:12.5px;min-height:18px}
.demo-note{font-size:12px;color:#FCD34D;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:14px;padding:10px 12px;text-align:left}

/* top */
.top{position:sticky;top:0;z-index:20;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);background:rgba(5,10,8,.62);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:"Space Grotesk";font-weight:600;flex:none}
.brand img{width:34px;height:34px;border-radius:50%}
.brand small{display:block;font-family:Inter;font-weight:500;font-size:10.5px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;line-height:1}
.nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.navp{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--dim);text-decoration:none;white-space:nowrap;border:1px solid transparent}
.navp:hover{color:var(--text);background:var(--panel)}
.navp.on{color:var(--text);background:var(--panel2);border-color:var(--line2)}
.navp i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.me{display:flex;align-items:center;gap:10px;flex:none}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ac,var(--lime));color:#08120B;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.demo-bar{background:rgba(251,191,36,.1);color:#FCD34D;text-align:center;font-size:12px;padding:6px 16px}
@media(max-width:760px){.nav{display:none}.top .in{justify-content:space-between}.me .nm{display:none}}

/* home */
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:42px 0 6px}
.home-head h1{font-size:clamp(28px,4vw,42px)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{padding:12px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:118px}
.stat b{display:block;font-family:"Space Grotesk";font-size:22px}
.stat span{font-size:11.5px;color:var(--dim)}
.stat.alert b{color:var(--danger)}
.orbit{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:30px 42px;padding:48px 0 40px}
.bwrap{animation:float 8s ease-in-out infinite}
.bwrap:nth-child(2n){animation-duration:9.5s;animation-delay:-3s;margin-top:70px}
.bwrap:nth-child(3n){animation-delay:-5s;margin-top:-26px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bubble{--c:#A3D65C;--s:210px;width:var(--s);height:var(--s);border-radius:50%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;cursor:pointer;color:var(--text);text-decoration:none;
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.24),rgba(255,255,255,0) 30%),radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--c) 26%,transparent),color-mix(in srgb,var(--c) 5%,transparent) 72%),rgba(10,18,15,.55);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 24px 70px -24px color-mix(in srgb,var(--c) 60%,transparent),inset 0 -22px 44px -12px color-mix(in srgb,var(--c) 38%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.bubble:hover{transform:scale(1.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 30px 90px -18px color-mix(in srgb,var(--c) 80%,transparent),inset 0 -22px 50px -10px color-mix(in srgb,var(--c) 55%,transparent)}
.bubble.lg{--s:250px}
.bubble .ic{font-size:20px;color:var(--c);margin-bottom:6px;line-height:1}
.bubble h3{font-size:16.5px;line-height:1.2}
.bubble .big{font-family:"Space Grotesk";font-size:30px;font-weight:700;margin-top:8px;color:#fff;line-height:1.1}
.bubble .lbl{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.bubble .stt{font-size:11px;margin-top:8px;padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.3);color:var(--c)}
.bubble .pulse{position:absolute;top:16%;right:16%;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.bubble.add{--c:#8FA398;--s:150px;border-style:dashed;background:transparent;box-shadow:none;color:var(--dim);font-weight:600;font-size:13px}
.bubble.add span{font-size:30px;font-weight:300;line-height:1;margin-bottom:6px}
@media(max-width:700px){.orbit{gap:16px;padding:30px 0}.bubble,.bubble.lg{--s:158px;padding:16px}.bubble.add{--s:120px}.bwrap:nth-child(n){margin-top:0}.bubble .big{font-size:21px}.bubble h3{font-size:13.5px}.bubble .stt{display:none}}

/* paneles */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel>h3{font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.cols-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:18px}
@media(max-width:900px){.cols2,.cols-main{grid-template-columns:1fr}}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;min-width:0}
.row-item:hover{background:var(--panel2);border-color:var(--line)}
.row-item .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:600px){.row-item .chip{display:none}}
.row-item .sub{font-size:11.5px;color:var(--dim);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,#8FA398)}
.empty{padding:22px;text-align:center;color:var(--dim2);font-size:13px;border:1px dashed var(--line2);border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* cabecera proyecto */
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:30px 0 22px}
.porb{width:48px;height:48px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.4),transparent 42%),var(--c);box-shadow:0 0 34px -4px var(--c)}
.phead h1{font-size:clamp(22px,3vw,32px);line-height:1.15}
.phead .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.phead .sp{flex:1}
.pdesc{white-space:pre-wrap;color:var(--dim);margin:0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.kpi{padding:18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-46px;top:-56px;background:radial-gradient(circle,color-mix(in srgb,var(--c) 32%,transparent),transparent 70%)}
.kpi .n{font-size:12px;color:var(--dim);position:relative}
.kpi .v{font-family:"Space Grotesk";font-size:26px;font-weight:700;margin-top:4px;position:relative}
.kpi .f{font-size:10.5px;color:var(--dim2);margin-top:2px}
.kpi.hl{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:5px}
.goal{font-size:11px;color:var(--dim);margin-top:6px}

/* tabla */
.tbl-wrap{overflow-x:auto;margin:0 -6px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--dim);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.calc{color:var(--c)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:rgba(255,255,255,.025)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--dim2);font-size:11px;font-family:Inter}

/* notas */
.notes{display:flex;flex-direction:column;gap:10px}
.note{padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);cursor:pointer}
.note:hover{border-color:var(--line2)}
.note b{display:block;font-size:13.5px}
.note p{margin:4px 0 0;color:var(--dim);font-size:12.5px;white-space:pre-wrap}
.note a{font-size:12px;word-break:break-all}

/* planner */
.ptool{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ptool h2{font-size:20px;min-width:180px;text-align:center}
.ptool .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--dim);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text)}
.pfs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pf{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;color:var(--dim)}
.pf i{width:7px;height:7px;border-radius:50%;background:var(--pc)}
.pf.on{color:var(--text);border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.pstats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.pstats .stat{min-width:0}
.pstats .stat b{color:var(--c)}
@media(max-width:700px){.pstats{grid-template-columns:repeat(3,1fr)}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.cal .dh{padding:10px 4px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--line);text-align:center}
.cal .cell{min-height:118px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:background .15s;min-width:0}
.cal .cell:nth-child(7n){border-right:none}
.cal .cell:hover{background:rgba(255,255,255,.03)}
.cal .cell.out{opacity:.35}
.cal .cell .d{font-size:12px;color:var(--dim);font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.cal .cell.today .d{background:var(--lime);color:#08120B}
.pchip{font-size:11px;padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.06);border-left:3px solid var(--sc);display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;cursor:pointer;min-width:0}
.pchip:hover{background:rgba(255,255,255,.13)}
.pchip .pd{display:flex;gap:2px;flex:none}
.pchip .pd i{width:6px;height:6px;border-radius:50%;background:var(--pc)}
.pchip .t{overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--dim);padding-left:4px}
@media(max-width:700px){.cal .cell{min-height:70px;padding:4px}.pchip .t{display:none}.pchip{padding:3px 4px}.cal .dh{font-size:9px;letter-spacing:0}}
.plist .pday{margin-bottom:16px}
.plist .pday h4{font-size:13px;color:var(--dim);margin:0 0 8px;font-family:Inter;font-weight:600;text-transform:capitalize}
.prow{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;border-left:3px solid var(--sc)}
.prow:hover{border-color:var(--line2)}
.prow .th{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:rgba(0,0,0,.3)}
.prow .bd{flex:1;min-width:0}
.prow .cap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.prow .top2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* kanban */
.kfilters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media(max-width:900px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;min-height:220px;transition:border-color .2s,background .2s}
.kcol.over{border-color:var(--lime);background:rgba(163,214,92,.06)}
.kcol>h3{font-size:14px;display:flex;align-items:center;gap:8px;margin:2px 4px 14px}
.kcol>h3 .cnt{font-size:11.5px;color:var(--dim);background:var(--panel2);padding:1px 8px;border-radius:999px;font-family:Inter}
.kcol>h3 .sp{flex:1}
.kcard{background:rgba(10,19,16,.9);border:1px solid var(--line2);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:grab;transition:transform .15s,border-color .15s}
.kcard:hover{border-color:rgba(255,255,255,.26);transform:translateY(-1px)}
.kcard.dragging{opacity:.35}
.kcard .tt{font-weight:600;display:flex;gap:10px;align-items:flex-start}
.kcard .chk{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line2);flex:none;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;background:transparent;color:#08120B;padding:0}
.kcard .chk:hover{border-color:var(--lime)}
.kcard.done .chk{background:var(--lime);border-color:var(--lime)}
.kcard.done .tt span{text-decoration:line-through;color:var(--dim)}
.kcard .ds{font-size:12.5px;color:var(--dim);margin:6px 0 0 28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0 28px;font-size:11.5px;color:var(--dim)}
.who{width:22px;height:22px;border-radius:50%;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:#08120B;background:var(--ac,#8FA398);flex:none}
.late{color:var(--danger)!important}
.prio{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--pc)}

/* generador */
.lgen{display:grid;grid-template-columns:220px minmax(300px,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media(max-width:1150px){.lgen{grid-template-columns:1fr}}
.lglist .row-item.on{background:var(--panel2);border-color:var(--line2)}
.lf fieldset{border:1px solid var(--line);border-radius:16px;padding:12px 14px 4px;margin:0 0 14px;min-width:0}
.lf legend{padding:0 8px;font-size:11px;font-weight:600;color:var(--lime);text-transform:uppercase;letter-spacing:.12em}
.lf .fld{margin-bottom:10px}
.tbox{border:1px solid var(--line2);border-radius:14px;padding:12px;margin-bottom:10px;background:rgba(0,0,0,.2)}
.tbox .th{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .fld{margin-bottom:0}
.ckl{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);cursor:pointer}
.ckl input{accent-color:var(--lime)}
.preview{position:sticky;top:78px}
.pbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.pbar .sp{flex:1}
.preview iframe{width:100%;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--line2);border-radius:18px;background:#142219;display:block}
.dev{display:inline-flex}
.preview.mobile iframe{width:390px;max-width:100%;margin:0 auto}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.mbox{width:100%;max-width:540px;background:#0B1512;border:1px solid var(--line2);border-radius:26px;padding:22px;box-shadow:0 40px 100px -30px #000;animation:pop .2s ease}
.mbox.wide{max-width:720px}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.mhead h3{font-size:19px}
.mfields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfields .full{grid-column:1/-1}
@media(max-width:520px){.mfields{grid-template-columns:1fr}}
.mfoot{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.mfoot .sp{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:7px;align-items:center;padding:6px 12px;border:1px solid var(--line2);border-radius:999px;cursor:pointer;font-size:12.5px}
.checks input{accent-color:var(--lime)}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.mrow>div:first-child{flex:1;min-width:0}
.mrow .mbtns{display:flex;gap:6px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{padding:10px 18px;border-radius:999px;background:#10201A;border:1px solid var(--line2);font-size:13px;animation:pop .2s;box-shadow:0 10px 30px -10px #000}
.tst.err{border-color:rgba(255,107,107,.5);color:#FFB4B4}
.loading{padding:120px 0;text-align:center;color:var(--dim)}
</style>
</head>

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); });
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const fmtD = (s, o={day:"numeric",month:"short"}) => s ? parseD(s).toLocaleDateString("es-UY", o) : "";
const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || "m";
const proj = id => S.projects.find(p => p.id === id);
const byType = t => S.projects.find(p => p.type === t);
const member = n => CONFIG.TEAM.find(m => m.name === n);
const initial = n => (n||"?").trim().charAt(0).toUpperCase();

function meName(){
  const e = (S.user?.email || "").toLowerCase();
  const m = CONFIG.TEAM.find(t => t.email && t.email.toLowerCase() === e);
  if (m) return m.name;
  const b = e.split("@")[0] || "equipo";
  return b.charAt(0).toUpperCase() + b.slice(1);
}
function fmtVal(v, unit){
  if (v == null || !isFinite(v)) return "—";
  const dec = (unit==="%" || unit==="x" || Math.abs(v) < 100) ? 2 : 0;
  const s = Number(v).toLocaleString("es-UY", { maximumFractionDigits: dec });
  if (unit === "%") return s + "%";
  if (unit === "x") return s + "x";
  return unit ? unit + " " + s : s;
}
function toast(msg, err){
  const t = document.createElement("div");
  t.className = "tst" + (err ? " err" : ""); t.textContent = msg;
  $("#toast").appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600);
}

/* ---------- métricas ---------- */
function baseMetrics(){ return [
  {key:"inversion",name:"Inversión",unit:"$",kind:"input"},
  {key:"leads",name:"Leads",unit:"",kind:"input"},
  {key:"ventas",name:"Ventas",unit:"",kind:"input"},
  {key:"ingresos",name:"Ingresos",unit:"$",kind:"input"},
  {key:"cpl",name:"CPL",unit:"$",kind:"formula",formula:"inversion / leads",lower_better:true,highlight:true},
  {key:"cierre",name:"Tasa de cierre",unit:"%",kind:"formula",formula:"ventas / leads * 100"},
  {key:"roas",name:"ROAS",unit:"x",kind:"formula",formula:"ingresos / inversion"}
];}
function cursoMetrics(){ return [
  {key:"inversion",name:"Inversión",unit:"$",kind:"input"},
  {key:"leads",name:"Leads",unit:"",kind:"input"},
  {key:"inscriptos",name:"Inscriptos",unit:"",kind:"input",highlight:true},
  {key:"ingresos",name:"Ingresos",unit:"$",kind:"input"},
  {key:"cpl",name:"CPL",unit:"$",kind:"formula",formula:"inversion / leads",lower_better:true},
  {key:"conversion",name:"Conversión",unit:"%",kind:"formula",formula:"inscriptos / leads * 100"},
  {key:"costo_inscripto",name:"Costo por inscripto",unit:"$",kind:"formula",formula:"inversion / inscriptos",lower_better:true}
];}
function evalFormula(expr, ctx){
  if (!expr) return null;
  const toks = String(expr).match(/[A-Za-z_][A-Za-z0-9_]*|\d+(?:[.,]\d+)?|[+\-*/()]|\S/g) || [];
  let js = "";
  for (const t of toks){
    if (/^[A-Za-z_]/.test(t)){ const raw = ctx[t]; const v = raw == null ? NaN : Number(raw); js += "(" + (isFinite(v) ? v : "NaN") + ")"; }
    else if (/^\d/.test(t)) js += t.replace(",", ".");
    else if (/^[+\-*/()]$/.test(t)) js += t;
    else return null;
  }
  try { const r = Function('"use strict";return (' + js + ")")(); return isFinite(r) ? r : null; } catch(e){ return null; }
}
const inputsOf = p => (p.metrics || []).filter(m => m.kind !== "formula");
function withFormulas(p, base){
  const ctx = { ...base };
  (p.metrics || []).forEach(m => { if (m.kind === "formula") ctx[m.key] = evalFormula(m.formula, ctx); });
  return ctx;
}
function totals(p){
  const t = {}; inputsOf(p).forEach(m => t[m.key] = null);
  S.entries.filter(e => e.project_id === p.id).forEach(e => inputsOf(p).forEach(m => {
    const v = parseFloat(e.vals?.[m.key]); if (isFinite(v)) t[m.key] = (t[m.key] || 0) + v;
  }));
  return withFormulas(p, t);
}
function entryCtx(p, e){
  const b = {}; inputsOf(p).forEach(m => { const v = parseFloat(e.vals?.[m.key]); b[m.key] = isFinite(v) ? v : null; });
  return withFormulas(p, b);
}
const heroMetric = p => (p.metrics || []).find(m => m.highlight) || (p.metrics || [])[0];

/* ---------- datos (Supabase o demo) ---------- */
const DemoDB = {
  key: "ju_panel_demo_v1",
  load(){ try { const r = localStorage.getItem(this.key); return r ? JSON.parse(r) : null; } catch(e){ return null; } },
  save(){ try { const o = {}; TABLES.forEach(t => o[t] = S[t]); localStorage.setItem(this.key, JSON.stringify(o)); } catch(e){} }
};
function upsertLocal(t, row){ const i = S[t].findIndex(r => r.id === row.id); if (i >= 0) S[t][i] = row; else S[t].push(row); }
const Store = {
  async loadAll(){
    if (DEMO){ const d = DemoDB.load() || seedDemo(); TABLES.forEach(t => S[t] = d[t] || []); DemoDB.save(); return; }
    await Promise.all(TABLES.map(t => this.reload(t)));
  },
  async reload(t){ const { data, error } = await sb.from(t).select("*"); if (error) throw error; S[t] = data || []; },
  async insert(t, row){
    row = { id: uid(), ...row };
    if (DEMO){ row.created_at = new Date().toISOString(); S[t].push(row); DemoDB.save(); return row; }
    const { data, error } = await sb.from(t).insert(row).select().single(); if (error) throw error; upsertLocal(t, data); return data;
  },
  async update(t, id, patch){
    if (DEMO){ const r = S[t].find(x => x.id === id); if (r) Object.assign(r, patch); DemoDB.save(); return r; }
    const { data, error } = await sb.from(t).update(patch).eq("id", id).select().single(); if (error) throw error; upsertLocal(t, data); return data;
  },
  async remove(t, id){
    if (!DEMO){ const { error } = await sb.from(t).delete().eq("id", id); if (error) throw error; }
    S[t] = S[t].filter(r => r.id !== id);
    if (t === "projects"){ S.entries = S.entries.filter(e => e.project_id !== id); S.notes = S.notes.filter(n => n.project_id !== id); S.tasks.forEach(k => { if (k.project_id === id) k.project_id = null; }); }
    if (DEMO) DemoDB.save();
  }
};
async function act(fn, ok){
  try { await fn(); if (ok) toast(ok); render(); return true; }
  catch(e){ console.error(e); toast("No se pudo guardar: " + (e.message || e), true); return false; }
}

/* ---------- auth / arranque ---------- */
async function boot(){
  window.addEventListener("hashchange", route);
  $("#loginForm").addEventListener("submit", e => e.preventDefault());
  $("#lBtn").addEventListener("click", doLogin);
  $("#loginForm").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); doLogin(e); } });
  $("#forgot").addEventListener("click", doForgot);
  $("#logout").addEventListener("click", doLogout);
  if (DEMO){
    $("#demoNote").hidden = false; $("#lPass").placeholder = "Contraseña (no hace falta en demo)";
    try { const u = localStorage.getItem("ju_panel_demo_user"); if (u){ S.user = { email:u }; return start(); } } catch(e){}
    return showLogin();
  }
  if (!window.supabase){ showLogin(); $("#lErr").textContent = "No se pudo cargar Supabase. Revisá tu conexión."; return; }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "SIGNED_OUT"){ S.user = null; showLogin(); }
    if (ev === "PASSWORD_RECOVERY") setTimeout(newPasswordForm, 400);
  });
  const { data } = await sb.auth.getSession();
  if (data.session){ S.user = data.session.user; start(); } else showLogin();
}
function showLogin(){ $("#app").hidden = true; $("#login").hidden = false; $("#lBtn").disabled = false; $("#lBtn").textContent = "Entrar"; }
async function doLogin(e){
  if (e) e.preventDefault();
  const email = $("#lEmail").value.trim(), pass = $("#lPass").value;
  $("#lErr").textContent = "";
  if (DEMO){
    const u = email || "demo@jardinurbano.uy"; S.user = { email:u };
    try { localStorage.setItem("ju_panel_demo_user", u); } catch(err){}
    return start();
  }
  if (!email || !pass){ $("#lErr").textContent = "Completá correo y contraseña."; return; }
  $("#lBtn").disabled = true; $("#lBtn").textContent = "Entrando…";
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error){ $("#lErr").textContent = /invalid/i.test(error.message) ? "Correo o contraseña incorrectos." : error.message; $("#lBtn").disabled = false; $("#lBtn").textContent = "Entrar"; return; }
  S.user = data.user; start();
}
async function doForgot(){
  const email = $("#lEmail").value.trim();
  if (DEMO){ $("#lErr").textContent = "En modo demo no hay contraseñas."; return; }
  if (!email){ $("#lErr").textContent = "Escribí tu correo arriba y tocá de nuevo."; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  $("#lErr").textContent = error ? error.message : "Te mandamos un mail para crear una contraseña nueva.";
}
async function doLogout(){
  if (DEMO){ try { localStorage.removeItem("ju_panel_demo_user"); } catch(e){} S.user = null; return showLogin(); }
  await sb.auth.signOut();
}
function newPasswordForm(){
  formModal({ title:"Nueva contraseña", submit:"Guardar contraseña",
    fields:[{ k:"p", l:"Contraseña nueva (mínimo 6 caracteres)", t:"password", full:true }],
    onSubmit: async v => { const { error } = await sb.auth.updateUser({ password: v.p }); if (error) throw error; toast("Contraseña actualizada"); }
  });
}
let rt = null;
async function start(){
  $("#login").hidden = true; $("#app").hidden = false; $("#demoBar").hidden = !DEMO;
  $("#meName").textContent = meName();
  const me = member(meName()); $("#meAv").textContent = initial(meName()); if (me) $("#meAv").style.setProperty("--ac", me.color);
  try { await Store.loadAll(); } catch(e){ console.error(e); $("#view").innerHTML = '<div class="loading">No se pudieron cargar los datos: ' + esc(e.message) + "<br>¿Corriste el SQL de configuración en Supabase?</div>"; return; }
  if (!DEMO && !rt){
    rt = sb.channel("panel").on("postgres_changes", { event:"*", schema:"public" }, p => {
      if (!TABLES.includes(p.table)) return;
      if (p.eventType === "DELETE") S[p.table] = S[p.table].filter(r => r.id !== p.old.id); else upsertLocal(p.table, p.new);
      softRender();
    }).subscribe();
  }
  route();
}

/* ---------- router / render ---------- */
function route(){
  const m = location.hash.match(/^#\/p\/([\w-]+)/);
  cur = m ? m[1] : null;
  if (cur && !proj(cur)){ location.hash = "#/"; return; }
  render(); window.scrollTo(0, 0);
}
let rT = null, pending = false;
function softRender(){
  clearTimeout(rT);
  rT = setTimeout(() => {
    const a = document.activeElement, p = cur && proj(cur);
    if (a && $("#view").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !(p && p.type === "landing")){ pending = true; return; }
    render({ soft:true });
  }, 150);
}
document.addEventListener("focusout", () => { if (pending){ pending = false; setTimeout(() => render({ soft:true }), 60); } });

function render(opt = {}){
  if (!S.user) return;

function sortedProjects(){ return [...S.projects].sort((a,b) => (a.sort||0) - (b.sort||0) || String(a.created_at).localeCompare(String(b.created_at))); }
function renderNav(){

function bind(v, H){
  v.onclick = e => { const a = e.target.closest("[data-act]"); if (a && v.contains(a) && H[a.dataset.act]){ e.preventDefault(); H[a.dataset.act](a.dataset, a, e); } };
  v.onchange = e => { const a = e.target.closest("[data-change]"); if (a && H[a.dataset.change]) H[a.dataset.change](a.dataset, a, e); };
  v.oninput = H.__input || null;
  v.ondragstart = H.__dragstart || null; v.ondragend = H.__dragend || null;
  v.ondragover = H.__dragover || null; v.ondragleave = H.__dragleave || null; v.ondrop = H.__drop || null;

function fieldHTML(f, val){

  else if (f.t === "select") inp = '<select class="inp" id="' + id + '" name="' + f.k + '">' + f.o.map(o => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(val ?? "") ? " selected" : "") + ">" + esc(o.l) + "</option>").join("") + "</select>";
  else if (f.t === "checkbox") return '<div class="' + cls + '"><label class="ckl"><input type="checkbox" name="' + f.k + '"' + (val ? " checked" : "") + "> " + esc(f.l) + "</label>" + help + "</div>";
  else if (f.t === "multi") inp = '<div class="checks">' + f.o.map(o => '<label><input type="checkbox" name="' + f.k + '" value="' + esc(o.v) + '"' + ((val || []).includes(o.v) ? " checked" : "") + "> " + esc(o.l) + "</label>").join("") + "</div>";
  else if (f.t === "colors") inp = '<div class="checks">' + COLORS.map(c => '<label style="border-color:' + c + '"><input type="radio" name="' + f.k + '" value="' + c + '"' + (c === val ? " checked" : "") + '> <span class="dot" style="--c:' + c + '"></span></label>').join("") + "</div>";
  else inp = '<input class="inp" id="' + id + '" name="' + f.k + '" type="' + (f.t || "text") + '"' + (f.t === "number" ? ' step="any"' : "") + ' value="' + esc(val ?? "") + '" placeholder="' + esc(f.ph || "") + '">';
  return '<div class="' + cls + '">' + lab + inp + help + "</div>";
}
function formModal({ title, fields, values = {}, submit = "Guardar", onSubmit, onDelete, onCancel, wide }){
  const box = openModal(
    '<form class="mform"><div class="mhead"><h3>' + esc(title) + '</h3><button type="button" class="icon-btn" data-close aria-label="Cerrar">×</button></div>' +
    '<div class="mfields">' + fields.map(f => fieldHTML(f, values[f.k])).join("") + "</div>" +
    '<div class="mfoot">' + (onDelete ? '<button type="button" class="btn danger" data-del>Eliminar</button>' : "") +
    '<span class="sp"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" type="button" data-submit>' + esc(submit) + "</button></div></form>",
    { wide, onClose: onCancel });
  const form = box.querySelector("form");
  form.addEventListener("submit", e => e.preventDefault());
  form.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT" && !/checkbox|radio/.test(e.target.type)){ e.preventDefault(); doSubmit(); } });
  const doSubmit = async () => {
    const v = {};
    fields.forEach(f => {
      if (f.t === "multi") v[f.k] = [...form.querySelectorAll('input[name="' + f.k + '"]:checked')].map(i => i.value);
      else if (f.t === "checkbox") v[f.k] = form.querySelector('input[name="' + f.k + '"]').checked;
      else if (f.t === "colors"){ const c = form.querySelector('input[name="' + f.k + '"]:checked'); v[f.k] = c ? c.value : values[f.k]; }
      else { const el = form.elements[f.k]; if (!el) return; let x = el.value; if (f.t === "number") x = x === "" ? null : Number(String(x).replace(",", ".")); if (f.t === "date" && !x) x = null; v[f.k] = typeof x === "string" ? x.trim() : x; }
    });
    for (const f of fields) if (f.req && (v[f.k] == null || v[f.k] === "")){ toast("Completá: " + f.l, true); return; }
    const btn = form.querySelector("[data-submit]"); if (btn.disabled) return; btn.disabled = true;
    try { const r = await onSubmit(v); if (r !== false){ closeModal(false); render(); } }
    catch(err){ console.error(err); toast("No se pudo guardar: " + (err.message || err), true); }
    btn.disabled = false;
  };
  form.querySelector("[data-submit]").addEventListener("click", doSubmit);
  if (onDelete){
    const d = box.querySelector("[data-del]");
    d.addEventListener("click", async () => {
      if (!d.dataset.sure){ d.dataset.sure = "1"; d.textContent = "¿Seguro? Tocá de nuevo"; return; }
      try { await onDelete(); closeModal(false); render(); toast("Eliminado"); } catch(err){ toast("No se pudo eliminar: " + err.message, true); }
    });
  }
  return box;
}

function lineChart(points, color, unit){
  const pts0 = points.filter(p => p.y != null && isFinite(p.y));
  if (points.length < 2 || pts0.length < 2) return '<div class="empty">Cargá al menos 2 registros para ver la evolución.</div>';
  const W = 640, H = 230, L = 58, R = 16, T = 16, B = 30;
  const ys = pts0.map(p => p.y); let min = Math.min(0, ...ys), max = Math.max(...ys); if (max === min) max = min + 1; max *= 1.08;
  const X = i => L + (W - L - R) * i / (points.length - 1), Y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const xy = points.map((p, i) => (p.y == null || !isFinite(p.y)) ? null : [X(i), Y(p.y), p]).filter(Boolean);
  const line = "M" + xy.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" L");
  const area = line + " L" + xy[xy.length-1][0].toFixed(1) + "," + Y(min).toFixed(1) + " L" + xy[0][0].toFixed(1) + "," + Y(min).toFixed(1) + " Z";
  const gid = "g" + Math.random().toString(36).slice(2, 7);
  let g = "";
  [0, .5, 1].forEach(f => { const v = min + (max - min) * f, y = Y(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="rgba(255,255,255,.07)"/><text x="' + (L - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + esc(fmtVal(v, unit)) + "</text>"; });
  const idx = points.length <= 6 ? points.map((_, i) => i) : [0, Math.round((points.length - 1) / 2), points.length - 1];
  idx.forEach(i => { g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? "start" : i === points.length - 1 ? "end" : "middle") + '">' + esc(points[i].x) + "</text>"; });
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img"><defs><linearGradient id="' + gid + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".35"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' + g +
    '<path d="' + area + '" fill="url(#' + gid + ')"/><path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    xy.map(q => '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="4" fill="#0B1512" stroke="' + color + '" stroke-width="2"><title>' + esc(q[2].x + ": " + fmtVal(q[2].y, unit)) + "</title></circle>").join("") + "</svg>";
}

  if (p.type === "tasks") return { big: S.tasks.filter(t => t.status !== "hecho").length, lbl: "pendientes" };
  if (p.type === "landing") return { big: S.landings.length, lbl: "landings guardadas" };
  return { big:"", lbl:"" };
}

function kpiHTML(m, v){
  const g = (m.goal === "" || m.goal == null) ? null : Number(m.goal);
  let goal = "";
  if (g != null && isFinite(g) && g !== 0){
    if (v != null && isFinite(v)){
      const ok = m.lower_better ? v <= g : v >= g;
      const r = m.lower_better ? (v <= 0 ? 1 : Math.min(g / v, 1)) : Math.max(0, Math.min(v / g, 1));
      goal = '<div class="bar"><i style="width:' + (r * 100).toFixed(0) + "%" + (ok ? ";background:var(--ok)" : "") + '"></i></div><div class="goal">Meta ' + fmtVal(g, m.unit) + (ok ? " · ✓ cumplida" : "") + "</div>";
    } else goal = '<div class="goal">Meta ' + fmtVal(g, m.unit) + "</div>";
  }
  return '<div class="kpi' + (m.highlight ? " hl" : "") + '"><div class="n">' + esc(m.name) + '</div><div class="v">' + fmtVal(v, m.unit) + '</div><div class="f">' + (m.kind === "formula" ? "Calculada · " + esc(m.formula) : "Total acumulado") + "</div>" + goal + "</div>";
}

async function saveMetrics(p, arr){ await Store.update("projects", p.id, { metrics: arr }); p.metrics = arr; render(); }
function openMetrics(p){
  const draw = () => {
    const ms = p.metrics || [];
    const box = openModal(
      '<div class="mhead"><h3>Métricas · ' + esc(p.name) + '</h3><button class="icon-btn" data-close aria-label="Cerrar">×</button></div>' +
      '<p class="help" style="margin-top:0">Las de <b>carga manual</b> se cargan en cada registro y se suman. Las <b>calculadas</b> usan una fórmula con las claves de otras métricas (ej: <code>inversion / leads</code>). La marcada con ★ es la que se ve en la burbuja.</p>' +
      '<div class="mlist">' + (ms.map((m, i) => '<div class="mrow"><div><b>' + (m.highlight ? "★ " : "") + esc(m.name) + "</b> <code>" + esc(m.key) + '</code><div class="help">' + (m.kind === "formula" ? "= " + esc(m.formula) : "Carga manual") + (m.unit ? " · " + esc(m.unit) : "") + (m.goal != null && m.goal !== "" ? " · Meta " + fmtVal(Number(m.goal), m.unit) : "") + (m.lower_better ? " · menor es mejor" : "") + '</div></div><div class="mbtns">' + (i > 0 ? '<button class="icon-btn" data-m="up" data-i="' + i + '" title="Subir">↑</button>' : "") + '<button class="icon-btn" data-m="edit" data-i="' + i + '" title="Editar">✎</button></div></div>').join("") || '<div class="empty">Sin métricas.</div>') + "</div>" +
      '<div class="mfoot"><button class="btn" data-m="add">+ Agregar métrica</button><span class="sp"></span><button class="btn primary" data-close>Listo</button></div>', { wide:true, nofocus:true });
    box.addEventListener("click", async e => {
      const b = e.target.closest("[data-m]"); if (!b) return; const i = +b.dataset.i;
      if (b.dataset.m === "add") metricForm(p, null, draw);
      else if (b.dataset.m === "edit") metricForm(p, i, draw);
      else if (b.dataset.m === "up" && i > 0){ const a = [...p.metrics]; [a[i-1], a[i]] = [a[i], a[i-1]]; try { await saveMetrics(p, a); draw(); } catch(err){ toast(err.message, true); } }
    });
  };
  draw();
}
function metricForm(p, i, back){
  const ms = p.metrics || [], m = i == null ? null : ms[i];
  const keys = ms.filter((x, j) => j !== i).map(x => "<code>" + esc(x.key) + "</code>").join(" ") || "—";
  formModal({
    title: m ? "Editar métrica" : "Nueva métrica", onCancel: back,
    values: m || { kind:"input", unit:"" },
    fields: [
      { k:"name", l:"Nombre", req:true, ph:"Ej: Consultas por WhatsApp" },
      { k:"unit", l:"Unidad", t:"select", o:UNITS },
      { k:"kind", l:"Cómo se obtiene", t:"select", full:true, o:[{v:"input",l:"Se carga a mano en cada registro (se suma)"},{v:"formula",l:"Se calcula con una fórmula"}] },
      { k:"formula", l:"Fórmula (solo si es calculada)", full:true, ph:"ventas / leads * 100", help:"Claves disponibles: " + keys + ". Podés usar + − * / y paréntesis." },
      { k:"goal", l:"Meta (opcional)", t:"number" },
      { k:"lower_better", l:"Menor es mejor (ej: CPL)", t:"checkbox" },
      { k:"highlight", l:"Mostrar en la burbuja ★", t:"checkbox", full:true }
    ],
    onSubmit: async v => {
      if (v.kind === "formula" && evalFormula(v.formula, {}) === null && !/[A-Za-z_]/.test(v.formula || "")){ toast("Revisá la fórmula", true); return false; }
      let key = m?.key;
      if (!key){ key = slug(v.name); let k2 = key, n = 2; while (ms.some(x => x.key === k2)) k2 = key + "_" + n++; key = k2; }
      const nm = { key, name:v.name, unit:v.unit, kind:v.kind, formula: v.kind === "formula" ? v.formula : "", goal: v.goal, lower_better: v.lower_better, highlight: v.highlight };
      let a = [...ms]; if (nm.highlight) a = a.map(x => ({ ...x, highlight:false }));
      if (m) a[i] = nm; else a.push(nm);
      await saveMetrics(p, a); closeModal(false); back(); return false;
    },
    onDelete: m ? async () => { const a = ms.filter((_, j) => j !== i); await saveMetrics(p, a); setTimeout(back, 0); } : null
  });
}

function renderOrganic(v, p){
  if (!UI.month){ const d = new Date(); UI.month = new Date(d.getFullYear(), d.getMonth(), 1); }
  const Y = UI.month.getFullYear(), M = UI.month.getMonth();
  const pre = Y + "-" + pad(M + 1);
  const match = x => !UI.pf.length || (x.platforms || []).some(k => UI.pf.includes(k));
  const posts = S.posts.filter(match);
  const monthPosts = posts.filter(x => String(x.fecha).startsWith(pre)).sort((a,b) => (a.fecha + (a.hora||"")).localeCompare(b.fecha + (b.hora||"")));
  const stats = Object.entries(POST_STATUS).map(([k,s]) => '<div class="stat" style="--c:' + s.c + '"><b>' + monthPosts.filter(x => x.status === k).length + "</b><span>" + s.l + "</span></div>").join("");
  const pfs = Object.entries(PLATFORMS).map(([k,o]) => '<button class="pf' + (UI.pf.includes(k) ? " on" : "") + '" style="--pc:' + o.c + '" data-act="pf" data-k="' + k + '"><i></i>' + o.n + "</button>").join("");
  let body = "";
  if (UI.pview === "mes"){
    const first = new Date(Y, M, 1), off = (first.getDay() + 6) % 7, days = new Date(Y, M + 1, 0).getDate();
    const weeks = Math.ceil((off + days) / 7), start = new Date(Y, M, 1 - off), t0 = today();
    let cells = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d => '<div class="dh">' + d + "</div>").join("");
    for (let i = 0; i < weeks * 7; i++){
      const d = new Date(start); d.setDate(start.getDate() + i); const ds = ymd(d);
      const list = posts.filter(x => x.fecha === ds).sort((a,b) => (a.hora||"").localeCompare(b.hora||""));
      cells += '<div class="cell' + (d.getMonth() !== M ? " out" : "") + (ds === t0 ? " today" : "") + '" data-act="newPost" data-d="' + ds + '"><span class="d">' + d.getDate() + "</span>" +
        list.slice(0, 3).map(chipHTML).join("") + (list.length > 3 ? '<span class="more">+' + (list.length - 3) + " más</span>" : "") + "</div>";
    }
    body = '<div class="cal">' + cells + "</div>";
  } else {
    const groups = {}; monthPosts.forEach(x => (groups[x.fecha] = groups[x.fecha] || []).push(x));
    body = '<div class="plist">' + (Object.keys(groups).length ? Object.entries(groups).map(([d, l]) => '<div class="pday"><h4>' + esc(fmtD(d, { weekday:"long", day:"numeric", month:"long" })) + "</h4>" + l.map(prowHTML).join("") + "</div>").join("") : '<div class="empty">No hay publicaciones este mes.</div>') + "</div>";
  }
  v.innerHTML = phead(p, '<button class="btn primary" data-act="newPost">+ Nueva publicación</button>') +
    '<div class="ptool"><button class="icon-btn" data-act="mPrev" aria-label="Mes anterior">‹</button><h2>' + MONTHS[M] + " " + Y + '</h2><button class="icon-btn" data-act="mNext" aria-label="Mes siguiente">›</button><button class="btn sm ghost" data-act="mToday">Hoy</button><span class="sp"></span>' +
    '<div class="seg"><button class="' + (UI.pview === "mes" ? "on" : "") + '" data-act="view" data-k="mes">Mes</button><button class="' + (UI.pview === "lista" ? "on" : "") + '" data-act="view" data-k="lista">Lista</button></div></div>' +
    '<div class="pfs">' + pfs + (UI.pf.length ? '<button class="pf" data-act="pfClear">Ver todas</button>' : "") + "</div>" +
    '<div class="pstats">' + stats + "</div>" + body;
  bind(v, {
    editProject: () => editProject(p),
    newPost: d => editPost(null, d.d),
    editPost: d => editPost(S.posts.find(x => x.id === d.id)),
    mPrev: () => { UI.month = new Date(Y, M - 1, 1); render(); },
    mNext: () => { UI.month = new Date(Y, M + 1, 1); render(); },
    mToday: () => { const d = new Date(); UI.month = new Date(d.getFullYear(), d.getMonth(), 1); render(); },
    view: d => { UI.pview = d.k; render(); },
    pf: d => { UI.pf = UI.pf.includes(d.k) ? UI.pf.filter(x => x !== d.k) : [...UI.pf, d.k]; render(); },
    pfClear: () => { UI.pf = []; render(); }
  });
}

      const html = generateLanding(LG.data);
      try { await navigator.clipboard.writeText(html); toast("HTML copiado"); }
      catch(e){ const ta = document.createElement("textarea"); ta.value = html; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("HTML copiado"); } catch(e2){ toast("No se pudo copiar", true); } ta.remove(); }
    },
    lgDl: () => {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([generateLanding(LG.data)], { type:"text/html" }));
      a.download = slug(LG.name || "landing").replace(/_/g, "-") + ".html"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    },
    lgDel: async d => {
      const b = v.querySelector('[data-act="lgDel"]');
      if (!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "¿?"; b.title = "Tocá de nuevo para eliminar"; toast("Tocá de nuevo para eliminar la landing"); return; }
      await act(async () => { await Store.remove("landings", LG.id); loadLanding(null); }, "Landing eliminada");
    }
  });
}
